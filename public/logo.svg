<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 48" width="208" height="48" role="img" aria-label="Saylient AI">
  <!-- Saylient AI lockup — light-theme version.
       Mark: a geometric "S" (two cubic bowls on a 24-unit grid) followed by
       three vertical bars of decreasing height (7, 4, 2) — the voice fading
       into silence. One flat colour (#9B2C2C, mirrors the oxblood accent token).
       Wordmark: "Saylient" in Fraunces 600; "AI" in the accent colour.
       Text #1A1A1A mirrors the ink token: use on warm ivory. -->
  <g transform="translate(0,10.2) scale(1.2)" fill="none" stroke="#9B2C2C" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17.5 7C17.5 4.2 15 2.5 12 2.5C9 2.5 6.5 4.2 6.5 7C6.5 9.8 9 11.5 12 11.5C15 11.5 17.5 13.2 17.5 16C17.5 18.8 15 20.5 12 20.5C9 20.5 6.5 18.8 6.5 16"/>
    <path d="M20.5 8.5V15.5M23 10V14M25.5 11V13"/>
  </g>
  <text x="42" y="31" font-family="Fraunces, Georgia, serif" font-size="27" font-weight="600" letter-spacing="-0.3" fill="#1A1A1A">Saylient<tspan fill="#9B2C2C">AI</tspan></text>
